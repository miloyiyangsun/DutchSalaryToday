name: Keep App Alive

on:
  # 手动触发 (用于测试)
  workflow_dispatch:
  # 定时执行 - 组合调度策略提高可靠性
  # 方案1: 主要调度 - 每15分钟执行 (更容易被系统接受)
  # 方案2: 备用调度 - 错峰时间补充 (避免主调度被跳过)
  schedule:
    - cron: '*/15 * * * *'      # 主要：每15分钟 (0,15,30,45分执行)
    - cron: '5,25,45 * * * *'   # 备用：错峰时间 (5,25,45分执行)
    - cron: '8,38 * * * *'      # 额外：填补空隙 (8,38分执行)

jobs:
  keep-alive:
    name: Ping Azure Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📍 Log Start Time
        run: |
          echo "🚀 Keep-alive started at $(date -u)"
          echo "⏰ Optimized schedule: Multiple time slots for reliability"
          echo "📅 Main: Every 15 mins (0,15,30,45) | Backup: (5,25,45) | Extra: (8,38)"
          
      - name: 🌐 Ping Frontend App (with retry)
        run: |
          echo "📱 Pinging Frontend at $(date -u)"
          url="https://frontend-webapp-16283450340.azurewebsites.net/"
          for attempt in {1..3}; do
            echo "🔄 Attempt $attempt/3 for Frontend"
            if response=$(curl -s -o /dev/null -w "%{http_code}:%{time_total}" --max-time 20 --connect-timeout 10 --head "$url"); then
              echo "✅ Frontend Success on attempt $attempt: $response"
              break
            else
              echo "⚠️ Frontend failed attempt $attempt"
              if [ $attempt -lt 3 ]; then
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          
      - name: ❤️ Ping Backend Health Check (with retry)
        run: |
          echo "🏥 Pinging Backend Health at $(date -u)"
          url="https://backend-webapp-16283450340.azurewebsites.net/actuator/health"
          for attempt in {1..3}; do
            echo "🔄 Attempt $attempt/3 for Backend Health"
            if response=$(curl -s -o /dev/null -w "%{http_code}:%{time_total}" --max-time 20 --connect-timeout 10 --head "$url"); then
              echo "✅ Backend Health Success on attempt $attempt: $response"
              break
            else
              echo "⚠️ Backend Health failed attempt $attempt"
              if [ $attempt -lt 3 ]; then
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          
      - name: 🎯 Ping Custom Ping Endpoint (with retry)
        run: |
          echo "🏓 Pinging Custom Ping at $(date -u)"
          url="https://backend-webapp-16283450340.azurewebsites.net/api/v1/ping"
          for attempt in {1..3}; do
            echo "🔄 Attempt $attempt/3 for Custom Ping"
            if response=$(curl -s -o /dev/null -w "%{http_code}:%{time_total}" --max-time 20 --connect-timeout 10 --head "$url"); then
              echo "✅ Custom Ping Success on attempt $attempt: $response"
              break
            else
              echo "⚠️ Custom Ping failed attempt $attempt"
              if [ $attempt -lt 3 ]; then
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          
      - name: 🚀 Ping Backend API Endpoint (with retry)
        run: |
          echo "📊 Pinging Backend API at $(date -u)"
          url="https://backend-webapp-16283450340.azurewebsites.net/api/v1/core-insights"
          for attempt in {1..3}; do
            echo "🔄 Attempt $attempt/3 for Backend API"
            if response=$(curl -s -o /dev/null -w "%{http_code}:%{time_total}" --max-time 20 --connect-timeout 10 --head "$url"); then
              echo "✅ Backend API Success on attempt $attempt: $response"
              break
            else
              echo "⚠️ Backend API failed attempt $attempt"
              if [ $attempt -lt 3 ]; then
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          
      - name: ✅ Log Completion
        run: |
          echo "🎉 Keep-alive completed successfully at $(date -u)"
          echo "📈 All services pinged and warmed up"
          echo "⏳ Next execution: Within 5-15 minutes (multi-schedule strategy)"