spring.application.name=dutch-salary-today

spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/salary_data}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# Flyway database migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server configuration
server.port=8080

# Spring Boot Actuator Health Check Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Connection Pool Optimization for Keep-Alive Performance
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000